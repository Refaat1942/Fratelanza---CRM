# Host nginx + Docker CRM (no public port — uses Docker DNS)
# Install:
#   cp deploy/nginx-crm-host.conf /etc/nginx/sites-available/crm.fratelanza.com
#   ln -sf /etc/nginx/sites-available/crm.fratelanza.com /etc/nginx/sites-enabled/
#   certbot --nginx -d crm.fratelanza.com
#   nginx -t && systemctl reload nginx

resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name crm.fratelanza.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.fratelanza.com;

    # certbot fills these paths after: certbot --nginx -d crm.fratelanza.com
    ssl_certificate     /etc/letsencrypt/live/crm.fratelanza.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.fratelanza.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        set $crm_upstream fratelanza-crm;
        proxy_pass http://$crm_upstream:16350;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
