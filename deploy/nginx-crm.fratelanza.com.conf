# Add this server block to the nginx that already serves fratelanza.com (same Docker network).
# CRM container alias: fratelanza-crm (no public port needed)

upstream fratelanza_crm_app {
    server fratelanza-crm:16350;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.fratelanza.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://fratelanza_crm_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
