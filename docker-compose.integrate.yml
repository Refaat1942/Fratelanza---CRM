# Join your Docker network + localhost socket for host nginx (not public).
services:
  web:
    ports:
      - "127.0.0.1:16350:16350"
    networks:
      default:
      proxy:
        aliases:
          - fratelanza-crm
    expose:
      - "16350"

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-fratelanza_default}
