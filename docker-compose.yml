services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fratelanza_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fratelanza} -d ${POSTGRES_DB:-fratelanza_crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    expose:
      - "16350"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fratelanza}:${POSTGRES_PASSWORD:-fratelanza_secret_change_me}@db:5432/${POSTGRES_DB:-fratelanza_crm}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key-in-production}
      APP_PORT: "16350"
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-ar}
      BRAND_NAME: ${BRAND_NAME:-Fratelanza CRM}
      BACKUP_DIR: /backups
      SKIP_STARTUP_MIGRATIONS: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - ./app/static/uploads:/app/app/static/uploads
    command: ["sh", "/app/scripts/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:16350/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-fratelanza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fratelanza_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-fratelanza_crm}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./backups:/backups
      - ./scripts/backup_db.sh:/backup_db.sh
    entrypoint: /bin/sh
    command: >
      -c "while true; do
            sh /backup_db.sh >> /backups/backup.log 2>&1 || true;
            sleep 86400;
          done"

volumes:
 